plugins {
    id "java"
    id "maven-publish"
    id "com.enonic.xp.app" version "3.6.2"
    id "com.github.node-gradle.node" version "7.1.0"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

app {
    name = providers.gradleProperty("appName").get()
    displayName = providers.gradleProperty("displayName").get()
    vendorName = providers.gradleProperty("vendorName").get()
    vendorUrl = providers.gradleProperty("vendorUrl").get()
    systemVersion = providers.gradleProperty("xpVersion").get()
    keepArchiveFileName = false
}

ext {
    deployDir = "../deploy/"
}

tasks.named("processResources") {
    // Keep ES6 in source for dev, but do not ship it in the app artifact
    exclude("**/*.es6")
}

tasks.register("npmBuild", NpmTask) {
    description = "Build javascript"
    group = "node"
    dependsOn("npmLint", ":frontend:build")
    inputs.dir "src/main"
    outputs.dir layout.buildDirectory.dir("resources")
    args = ["run", "build"]
}

def npmBuildTask = tasks.named("npmBuild")
def jarTask = tasks.named("jar")

tasks.named("jar") {
    dependsOn(npmBuildTask)
}

tasks.register("packageApplication", Copy) {
    description = "Packages entire application"
    group = "application"
    dependsOn(tasks.named("build"))
    from(jarTask.flatMap { it.archiveFile })
    into(layout.projectDirectory.dir(deployDir))
    def _projectName = projectName  // captured at configuration time
    rename { "${_projectName}.jar" }
}

// This dependency makes sure that the newest .jar file is copied over to /deploy when we run "make deploy"
tasks.named("deploy") {
    dependsOn("packageApplication")
}

tasks.register("npmLint") {
    description = "Run all linting tasks"
    group = "node"
    dependsOn("npmLintBackend", "npmLintPhrases", ":frontend:npmLint")
}

tasks.register("npmLintBackend", NpmTask) {
    description = "Lint backend javascript"
    group = "node"
    dependsOn("installWithCI")
    inputs.dir "src/main/resources"
    inputs.files "package.json", "package-lock.json", ".babelrc", "eslint.config.js"
    outputs.file layout.buildDirectory.file("lint-results/backend-lint-result")
    args = ["run", "lint:backend"]
}

tasks.register("npmLintPhrases", NpmTask) {
    description = "Validate i18n phrases"
    group = "node"
    dependsOn("installWithCI")
    inputs.dir "src/main/resources/site/i18n"
    outputs.file layout.buildDirectory.file("lint-results/xptool-lint-result")
    args = ["run", "lint:xptool"]
}

tasks.register("installWithCI", NpmTask) {
    description = "Install node dependencies with ci, ignoring scripts"
    group = "node"
    inputs.files "package.json", "package-lock.json"
    outputs.dir "./node_modules"
    args = ["ci", "--ignore-scripts", "--quiet"]
    outputs.cacheIf { true }
}

tasks.register("npm_install", NpmTask) {
    description = "Install node dependencies, ignoring scripts"
    group = "node"
    args = ["install", "--ignore-scripts", "--quiet"]
}

dependencies {
    implementation "com.enonic.xp:core-api:${xpVersion}"
    implementation "com.enonic.xp:portal-api:${xpVersion}"
    include "com.enonic.xp:lib-content:${xpVersion}"
    include "com.enonic.xp:lib-context:${xpVersion}"
    include "com.enonic.xp:lib-event:${xpVersion}"
    include "com.enonic.xp:lib-i18n:${xpVersion}"
    include "com.enonic.xp:lib-portal:${xpVersion}"
    include "com.github.tineikt:xp-lib-freemarker:2.0.3"
}

repositories {
    mavenLocal()
    mavenCentral()
    xp.enonicRepo()

    // Needed by freemarker
    maven {
        url = "https://jitpack.io"
        // Future jitpack dependencies need to be explicitly included below. This is usually groupIds in the form of 'com.github.username'
        content { includeGroup "com.github.tineikt" }
    }
}

publishing {
    publications {
        tableBuilder(MavenPublication) {
            groupId = project.group.toString()
            artifactId = "tablebuilder"
            version = project.version.toString()
            artifact(tasks.named("jar"))
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/bouvet-apps/table-builder")
            credentials {
                username = providers.gradleProperty("bouvetGithubUser").orNull
                password = providers.gradleProperty("bouvetGithubToken").orNull
            }
        }
    }
}

node {
    // Version of node to use.
    version = '24.18.0'

    // Version of npm to use.
    npmVersion = '11.16.0'

    // If true, it will download node using above parameters.
    // If false, it will try to use globally installed node.
    download = true
}

wrapper {
    gradleVersion = "8.14.4"
    distributionType = Wrapper.DistributionType.BIN
}
